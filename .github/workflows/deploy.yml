name: CI/CD (Docker / EC2)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew
      - name: Build & Test
        run: ./gradlew build

  deploy:
    name: Deploy to EC2 (docker compose)
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - run: chmod +x gradlew

      - name: Build boot jar (skip test)
        run: ./gradlew :app:bootJar -x test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Open SSH for runner IP
        id: sg
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr "$RUNNER_IP/32" || true

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/key.pem
          chmod 600 /tmp/key.pem

      - name: Ship jar + Dockerfile to EC2
        run: |
          SSHO="ssh -i /tmp/key.pem -o StrictHostKeyChecking=no"
          $SSHO ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'mkdir -p ~/app/BE/app/build/libs'
          rsync -az -e "$SSHO" Dockerfile ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/BE/'
          rsync -az -e "$SSHO" app/build/libs/app-0.0.1-SNAPSHOT.jar ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:'~/app/BE/app/build/libs/'

      - name: Compose up backend + health check
        run: |
          ssh -i /tmp/key.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            'cd ~/app/deploy && docker compose up -d --build backend && \
             curl -s --retry 30 --retry-delay 3 --retry-all-errors -o /dev/null -w "backend health: %{http_code}\n" http://localhost/actuator/health'

      - name: Close SSH for runner IP
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr "${{ steps.sg.outputs.ip }}/32" || true
