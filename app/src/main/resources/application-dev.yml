spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  allowed-redirect-origins: "${APP_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000,http://localhost:5173}"

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.atomiccv: DEBUG

worklog:
  openai:
    api-key: ${OPENAI_API_KEY}
  github:
    token: ${GITHUB_TOKEN}
    org: resume-helper
  audio:
    upload-dir: /tmp/worklog/audio

cloud:
  aws:
    region:
      static: ap-northeast-2

resume:
  s3:
    bucket-name: ${RESUME_S3_BUCKET:atomiccv-resumes-dev}
