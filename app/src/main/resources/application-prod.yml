spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:3600000}

app:
  frontend-url: ${APP_FRONTEND_URL}
  allowed-redirect-origins: ${APP_ALLOWED_REDIRECT_ORIGINS:${APP_FRONTEND_URL}}
  cookie-same-site: None
  cookie-domain: .developlife.co.kr

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

worklog:
  openai:
    api-key: ${OPENAI_API_KEY}
  github:
    token: ${GITHUB_TOKEN}
    org: resume-helper
  audio:
    upload-dir: /var/worklog/audio

logging:
  structured:
    format:
      console: ecs

cloud:
  aws:
    region:
      static: ${CLOUD_AWS_REGION_STATIC:ap-northeast-2}

resume:
  s3:
    bucket-name: ${RESUME_S3_BUCKET_NAME:resumes-dev-1}
